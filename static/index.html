<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>职能沟通翻译助手</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1em;
        }

        .content {
            padding: 40px;
        }

        .direction-selector {
            display: flex;
            gap: 20px;
            margin-bottom: 30px;
            background: #f5f5f5;
            padding: 20px;
            border-radius: 10px;
        }

        .direction-option {
            flex: 1;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            cursor: pointer;
            text-align: center;
            transition: all 0.3s;
            background: white;
        }

        .direction-option:hover {
            border-color: #667eea;
            transform: translateY(-2px);
        }

        .direction-option.active {
            border-color: #667eea;
            background: #667eea;
            color: white;
        }

        .direction-option h3 {
            margin-bottom: 5px;
        }

        .direction-option p {
            font-size: 0.9em;
            opacity: 0.8;
        }

        .input-section, .output-section {
            margin-bottom: 30px;
        }

        .input-section label, .output-section label {
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
            color: #333;
        }

        textarea {
            width: 100%;
            min-height: 200px;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
            font-family: inherit;
            resize: vertical;
            transition: border-color 0.3s;
        }

        textarea:focus {
            outline: none;
            border-color: #667eea;
        }

        .output-area {
            min-height: 300px;
            max-height: 600px;
            overflow-y: auto;
            padding: 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #f9f9f9;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-size: 16px;
            line-height: 1.6;
        }

        .output-area.empty {
            color: #999;
            font-style: italic;
        }

        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 20px;
        }

        button {
            flex: 1;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .btn-primary:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .btn-secondary {
            background: #f5f5f5;
            color: #333;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .loading {
            display: none;
            text-align: center;
            padding: 20px;
            color: #667eea;
        }

        .loading.active {
            display: block;
        }

        .loading::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 5px;
            font-size: 14px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .status.active {
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🤝 职能沟通翻译助手</h1>
            <p>让产品与开发之间的沟通更顺畅</p>
        </div>

        <div class="content">
            <div class="direction-selector">
                <div class="direction-option active" data-direction="product_to_dev">
                    <h3>📱 产品 → 开发</h3>
                    <p>将产品需求翻译为技术语言</p>
                </div>
                <div class="direction-option" data-direction="dev_to_product">
                    <h3>💻 开发 → 产品</h3>
                    <p>将技术方案翻译为业务语言</p>
                </div>
            </div>

            <div class="input-section">
                <label for="input-content">输入内容：</label>
                <textarea id="input-content" placeholder="请输入需要翻译的内容..."></textarea>
            </div>

            <div class="button-group">
                <button class="btn-primary" id="translate-btn">开始翻译</button>
                <button class="btn-secondary" id="clear-btn">清空</button>
            </div>

            <div class="loading" id="loading">翻译中</div>
            <div class="status" id="status"></div>

            <div class="output-section">
                <label for="output-content">翻译结果：</label>
                <div class="output-area empty" id="output-content">翻译结果将显示在这里...</div>
            </div>
        </div>
    </div>

    <script>
        let currentDirection = 'product_to_dev';
        let eventSource = null;

        // 方向选择
        document.querySelectorAll('.direction-option').forEach(option => {
            option.addEventListener('click', () => {
                document.querySelectorAll('.direction-option').forEach(opt => opt.classList.remove('active'));
                option.classList.add('active');
                currentDirection = option.dataset.direction;
            });
        });

        // 翻译按钮
        document.getElementById('translate-btn').addEventListener('click', async () => {
            const content = document.getElementById('input-content').value.trim();
            if (!content) {
                showStatus('请输入要翻译的内容', 'error');
                return;
            }

            // 停止之前的请求
            if (eventSource) {
                eventSource.close();
            }

            // 清空输出
            const outputArea = document.getElementById('output-content');
            outputArea.textContent = '';
            outputArea.classList.remove('empty');

            // 显示加载状态
            document.getElementById('loading').classList.add('active');
            document.getElementById('translate-btn').disabled = true;
            hideStatus();

            try {
                // 发送请求
                const response = await fetch('/api/translate', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        content: content,
                        direction: currentDirection
                    })
                });

                if (!response.ok) {
                    const error = await response.json();
                    throw new Error(error.error || '翻译失败');
                }

                // 处理流式响应
                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;

                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); // 保留最后一个不完整的行

                    for (const line of lines) {
                        if (line.startsWith('data: ')) {
                            const data = line.slice(6);
                            if (data === '[DONE]') {
                                break;
                            }
                            try {
                                const json = JSON.parse(data);
                                if (json.content) {
                                    outputArea.textContent += json.content;
                                    // 自动滚动到底部
                                    outputArea.scrollTop = outputArea.scrollHeight;
                                }
                                if (json.error) {
                                    throw new Error(json.error);
                                }
                            } catch (e) {
                                if (e.message) {
                                    throw e;
                                }
                            }
                        }
                    }
                }
            } catch (error) {
                showStatus('翻译失败: ' + error.message, 'error');
                outputArea.textContent = '翻译失败，请重试。';
            } finally {
                document.getElementById('loading').classList.remove('active');
                document.getElementById('translate-btn').disabled = false;
            }
        });

        // 清空按钮
        document.getElementById('clear-btn').addEventListener('click', () => {
            document.getElementById('input-content').value = '';
            const outputArea = document.getElementById('output-content');
            outputArea.textContent = '';
            outputArea.classList.add('empty');
            hideStatus();
            if (eventSource) {
                eventSource.close();
                eventSource = null;
            }
        });

        function showStatus(message, type) {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = `status ${type} active`;
            setTimeout(hideStatus, 5000);
        }

        function hideStatus() {
            document.getElementById('status').classList.remove('active');
        }
    </script>
</body>
</html>
